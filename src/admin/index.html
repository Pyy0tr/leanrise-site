<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LEANRISE — Administration</title>
    <script>window.CMS_MANUAL_INIT = true</script>
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      CMS.init({
        config: {
          backend: {
            name: 'github',
            repo: 'Pyy0tr/leanrise-site',
            branch: 'main',
            base_url: 'https://www.leanrise-coaching.com',
            auth_endpoint: 'api/auth',
          },
          media_folder: 'src/assets/images/photos',
          public_folder: '/assets/images/photos',
          collections: [
            {
              name: 'testimonials',
              label: 'Témoignages vidéo',
              files: [
                {
                  name: 'testimonials',
                  label: 'Vidéos YouTube',
                  file: 'src/_data/testimonials.json',
                  format: 'json',
                  fields: [
                    { name: 'videos', label: 'IDs YouTube (un par ligne)', widget: 'list' },
                  ],
                },
              ],
            },
            {
              name: 'transformations',
              label: 'Photos de transformation',
              files: [
                {
                  name: 'transformations',
                  label: 'Photos',
                  file: 'src/_data/transformations.json',
                  format: 'json',
                  fields: [
                    {
                      name: 'photos',
                      label: 'Photos',
                      widget: 'list',
                      fields: [
                        { name: 'photo', label: 'Photo', widget: 'image' },
                      ],
                    },
                  ],
                },
              ],
            },
          ],
        },
      })
    </script>
  </body>
</html>
